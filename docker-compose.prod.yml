name: labrecha

services:
  postgres:
    image: base-images/postgres:16
    container_name: labrecha-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  api-py:
    build:
      context: .
      dockerfile: api-py/Dockerfile
    image: labrecha-api
    container_name: labrecha-api-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://labrecha.matiascaliz.com.ar}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    networks:
      - db-network
      - app-network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    container_name: web-prod
    depends_on:
      api-py:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      LABRECHA_API_INTERNAL_URL: http://api-py:8000
      LABRECHA_ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - app-network
      - shared-nginx
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    image: labrecha-scraper
    profiles:
      - scraper
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      HTTP_MAX_ATTEMPTS: ${HTTP_MAX_ATTEMPTS:-6}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-labrecha-scraper/0.1 (+https://labrecha.ar)}
      LOG_DIR: ${SCRAPER_LOG_DIR:-/var/log/labrecha}
    networks:
      - db-network
      - app-network
    restart: "no"
    volumes:
      # Log rotado de corridas y fallos: sobrevive al contenedor efimero.
      - scraper_logs:/var/log/labrecha
      # Boletin Oficial: traductor IA via CLI claude headless (suscripcion del
      # host, sin API key). Binario nativo + credenciales OAuth del usuario deploy.
      - /home/deploy/.local/bin/claude:/usr/local/bin/claude:ro
      - /home/deploy/.claude:/root/.claude
      - /home/deploy/.claude.json:/root/.claude.json
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # Sin cap_drop ALL: el CLI claude headless (Boletin) necesita el set de caps
    # default de Docker; se conservan no-new-privileges + limite de RAM + tmpfs.
    tmpfs:
      - /tmp

  nginx:
    image: base-images/nginx:alpine
    container_name: labrecha-nginx
    profiles:
      - legacy-edge
    depends_on:
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - app-network
      - shared-nginx
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  postgres_data:
    driver: local
  scraper_logs:
    driver: local

networks:
  db-network:
    driver: bridge
    internal: true
  app-network:
    driver: bridge
  shared-nginx:
    external: true
