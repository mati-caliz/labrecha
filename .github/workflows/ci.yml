name: CI - Tests & Linting

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - 'package*.json'
            python:
              - 'api-py/**'
              - 'scraper/**'
              - 'shared/**'

  frontend-lint:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/**/*.js', 'web/**/*.jsx', 'web/**/*.ts', 'web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  python-check:
    name: Python Lint, Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.python == 'true'

    # Los tests de la API y de las migraciones corren contra un Postgres real: son los que
    # verifican el SQL de los routers y que el esquema migrado coincida con los modelos.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labrecha
          POSTGRES_PASSWORD: labrecha123
          POSTGRES_DB: labrecha
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U labrecha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Lint (ruff)
        run: ruff check api-py/labrecha_api api-py/tests scraper/labrecha_scraper shared/labrecha_db

      - name: Format check (ruff)
        run: ruff format --check api-py/labrecha_api api-py/tests scraper/labrecha_scraper shared/labrecha_db

      - name: Byte-compile sources
        run: python -m compileall -q api-py/labrecha_api scraper/labrecha_scraper shared/labrecha_db

      - name: Install API, scraper and shared packages
        run: pip install "./shared[migrations]" "./api-py[dev]" ./scraper

      - name: Tests (pytest)
        # REQUIRE_TEST_DATABASE=1 hace que la suite falle en vez de saltearse si no hay
        # Postgres: en CI el skip silencioso sería peor que no tener los tests.
        env:
          REQUIRE_TEST_DATABASE: '1'
          TEST_DATABASE_URL: postgresql+psycopg2://labrecha:labrecha123@localhost:5433/labrecha_test
        run: python -m pytest api-py/tests

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, frontend-lint, python-check]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Frontend changed: ${{ needs.changes.outputs.frontend }}"
          echo "Python changed: ${{ needs.changes.outputs.python }}"

          if [ "${{ needs.frontend-lint.result }}" == "failure" ] || [ "${{ needs.python-check.result }}" == "failure" ]; then
            echo "❌ CI checks failed"
            exit 1
          else
            echo "✅ All CI checks passed"
          fi
