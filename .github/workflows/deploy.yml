name: Deploy to Production

# Sin disparador por push: el deploy se hace local en el VPS con docker compose.
# Cada corrida acá gastaba minutos de Actions para, casi siempre, entrar por SSH y
# descubrir que el repo del box ya estaba en el commit pusheado y no rebuildear nada.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            cd /home/deploy/labrecha

            echo "📥 Pulling latest changes..."
            git pull origin main

            echo "🔍 Detecting changes..."
            API_CHANGED=$(git diff HEAD@{1} HEAD --name-only | grep -q "api-py/" && echo "true" || echo "false")
            FRONTEND_CHANGED=$(git diff HEAD@{1} HEAD --name-only | grep -q "web/" && echo "true" || echo "false")

            echo "API changed: $API_CHANGED"
            echo "Frontend changed: $FRONTEND_CHANGED"

            if [ "$API_CHANGED" = "true" ]; then
              echo "🔨 Building API..."
              docker compose -f docker-compose.prod.yml build api-py
            else
              echo "⏭️ Skipping API build (no changes)"
            fi

            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "🔨 Building frontend..."
              docker compose -f docker-compose.prod.yml build frontend
            else
              echo "⏭️ Skipping frontend build (no changes)"
            fi

            echo "🗄️ Applying database migrations..."
            docker compose -f docker-compose.prod.yml build scraper
            if ! docker compose -f docker-compose.prod.yml --profile scraper run --rm -T scraper db upgrade; then
              echo "❌ Migrations failed: aborting before restarting services."
              echo "   The running containers keep the previous code, so production stays as it was."
              exit 1
            fi

            echo "🚀 Starting services..."
            docker compose -f docker-compose.prod.yml up -d

            echo "⏳ Waiting for services..."
            sleep 15

            echo "📊 Service status:"
            docker compose -f docker-compose.prod.yml ps

            echo "🧹 Cleaning up..."
            docker image prune -f --filter "dangling=true" || true
            docker builder prune -f --filter "unused-for=24h" || true

            echo "✅ Deployment complete!"
            echo "🌐 Site: http://178.156.210.71"
